[project]
name = "k-backend"
version = "0.1.0"
description = "Django REST API for the dj-next authentication starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "django-environ>=0.12",
    "psycopg2-binary>=2.9.10",
    "djangorestframework>=3.16",
    "django-allauth[headless-spec,mfa,socialaccount]>=65.8",
    "requests>=2.32",
    "drf-spectacular[sidecar]>=0.28",
    "pillow>=11.2",
]

[dependency-groups]
dev = [
    "rav>=0.0.9",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.11",
    "mypy>=1.16",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
]

[tool.uv]
package = false

[tool.rav]
yaml_path = "rav.yaml"

[tool.pytest.ini_options]
addopts = "--ds=config.settings -v"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
show-fixes = true
preview = true

[tool.ruff.lint]
select = ["ALL"]
exclude = ["migrations", ".venv"]
ignore = [
  "D203",  # conflicting with D211 (docstring style)
  "TRY003",  # Allow implicit exception messages
  "D213", # Allow blank lines after docstring
  "COM812",  # Allow comments on the same line as code
  "E501",  # Ruff should defer to Black for line length enforcement. You should typically disable E501."
  ### Ignored for now, see
  "D100", "D104",       # docstring module/package
  "CPY001",             # copyright
  "TRY002",             # exception class
  "EM101",              # string literal in exception
  "ERA001",             # commented out code
]

[tool.ruff.lint.per-file-ignores]
# Tests
"**/tests/*.py" = ["ARG001", "ARG002", "S106", "PLR6301", "S101", "ANN001", "ANN201", "PLR2004", "DOC201"]
"**/test_*.py" = ["ARG001", "ARG002", "S106", "PLR6301", "S101", "ANN001", "ANN201", "PLR2004", "DOC201"]

# Views and API
"**/views.py" = ["ARG001", "ARG002"]
"**/urls.py" = ["ARG002", "D101", "D102", "PLR6301"]

# Commands
"*/management/commands/*.py" = ["ANN002", "ANN003", "ARG002", "ANN201", "D102"]

# Migrations
"**/migrations/*.py" = ["E501", "D101", "RUF012"]



[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["backend"]
exclude = [
  "migrations",
  "backend/.*/migrations/.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
