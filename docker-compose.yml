# Local development services. Credentials and host ports come from
# backend/backend/.env (see backend/backend/.env.example).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djnext}
      POSTGRES_USER: ${POSTGRES_USER:-djnext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djnext}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends (verification, password reset) so you can
  # read them at http://localhost:8025 instead of needing a real mail server.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
